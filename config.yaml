alignment:
  backend: faster-whisper
  language: auto
  model: small
  device: auto
  compute_type: int8
  min_similarity: 0.62

separation:
  enabled: auto
  backend: demucs
  model: htdemucs

video:
  width: 1920
  height: 1080
  fps: 30
  background: procedural
  background_color: "#080B1A"

karaoke:
  font: Arial
  font_size: 72
  max_lines: 2
  max_chars_per_line: 42
  active_color: "#FFD43B"
  inactive_color: "#F2F3F5"
  preview_color: "#A7ABB7"

output:
  audio_mode: instrumental
  video_bitrate: 8M
  audio_bitrate: 256k

